services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
  frontend: 
    build: 
      context: ./app
      dockerfile: frontend/Dockerfile
    ports: 
      - "5173:5173"
    volumes: 
      - ./app:/app
      - /app/frontend/node_modules
      - /app/frontend/dist
  backend: 
    build: 
      context: ./app
      dockerfile: backend/Dockerfile
    env_file: 
      - .env
    environment: 
      - DB_HOST=db
    ports: 
      - "3000:3000"
    volumes: 
      - ./app:/app
      - /app/backend/node_modules
      - ./catFiles:/app/catFiles

  
  